  /analytics/applications-trend:
    get:
      operationId: getApplicationsTrend
      tags: [analytics]
      responses:
        "200":
          description: Application counts over time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationTrendPoint"

  /analytics/application-status-breakdown:
    get:
      operationId: getApplicationStatusBreakdown
      tags: [analytics]
      responses:
        "200":
          description: Application status breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusBreakdownItem"

  # PLACEMENT OFFICER - USERS
  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
        - name: role
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"

  /admin/users/{id}/status:
    patch:
      operationId: updateUserStatus
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # RECRUITERS
  /recruiters/profile:
    get:
      operationId: getRecruiterProfile
      tags: [recruiters]
      responses:
        "200":
          description: Recruiter profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recruiter"
    put:
      operationId: updateRecruiterProfile
      tags: [recruiters]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecruiterProfileInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recruiter"

  /recruiters:
    get:
      operationId: listRecruiters
      tags: [recruiters]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Recruiters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecruiterPage"

  /recruiters/{id}/shortlist:
    patch:
      operationId: shortlistApplicant
      tags: [recruiters]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShortlistInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    UploadResponse:
      type: object
      properties:
        url:
          type: string
        publicId:
          type: string
      required: [url, publicId]

    PhotoUrlUpdate:
      type: object
      required: [url]
      properties:
        url:
          type: string
        publicId:
          type: string

    ResumeUrlUpdate:
      type: object
      required: [url]
      properties:
        url:
          type: string
        publicId:
          type: string

    # AUTH
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    StudentRegistrationInput:
      type: object
      required: [email, password, firstName, lastName, rollNumber, branch, year]
      properties:
        email:
          type: string
        password:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        rollNumber:
          type: string
        branch:
          type: string
        year:
          type: integer
        phone:
          type: string

    RecruiterRegistrationInput:
      type: object
      required: [email, password, firstName, lastName, companyName, designation]
      properties:
        email:
          type: string
        password:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        companyName:
          type: string
        designation:
          type: string
        phone:
          type: string

    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string

    ResetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, email, role, isActive]
      properties:
        id:
          type: integer
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [STUDENT, RECRUITER, PLACEMENT_OFFICER]
        isActive:
          type: boolean
        createdAt:
          type: string

    UserPage:
      type: object
      required: [content, totalElements, totalPages, page, size]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/User"
        totalElements:
          type: integer
        totalPages:
          type: integer
        page:
          type: integer
        size:
          type: integer

    UserStatusUpdate:
      type: object
      required: [isActive]
