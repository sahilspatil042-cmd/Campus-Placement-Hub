kind = "web"
previewPath = "/"
title = "Campus Placement Management System"
version = "1.0.0"
id = "artifacts/campus-placement"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20238

[services.development]
run = "pnpm --filter @workspace/campus-placement run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/campus-placement", "run", "build" ]
serve = "static"
publicDir = "artifacts/campus-placement/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20238"
BASE_PATH = "/"
